<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Sem conexão | Nexus Finance</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:#f1f1ee}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(440px,100%);padding:28px;border:1px solid #292929;border-radius:20px;background:#111;text-align:center}
    .logo{margin:0 auto 20px;width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:#d6b400;color:#080808;font-size:28px;font-weight:800}
    h1{font-size:24px;margin:0 0 12px}
    p{color:#aaa;line-height:1.6;margin:0 0 22px}
    a{display:inline-block;padding:12px 18px;border-radius:12px;background:#d6b400;color:#080808;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">N</div>
    <h1>Sem conexão com a internet</h1>
    <p>O aplicativo pode abrir, mas login, movimentações e informações financeiras precisam de conexão segura com o servidor. Seus dados financeiros não são salvos para uso offline.</p>
    <a href="/">Tentar novamente</a>
  </main>
</body>
</html>
