name: Extract backend audit snapshot

on:
  push:
    branches: [deploy-backend]
    paths:
      - ".github/workflows/extract-backend-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract backend source for review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-unpack audit_snapshot
          mkdir .audit-unpack audit_snapshot
          unzip -q nexus-finance-deploy.zip -d .audit-unpack
          mkdir -p audit_snapshot/backend
          cp .audit-unpack/backend/server.py audit_snapshot/backend/server.py
          cp .audit-unpack/backend/migrate.py audit_snapshot/backend/migrate.py
          cp .audit-unpack/backend/requirements.txt audit_snapshot/backend/requirements.txt
          cp -R .audit-unpack/backend/migrations audit_snapshot/backend/migrations
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nexus Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit_snapshot
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract backend audit snapshot [skip ci]"
          git push

