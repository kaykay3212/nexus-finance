name: Security checks

on:
  push:
    branches: [deploy-backend]
  pull_request:
    branches: [deploy-backend]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble package from secured sources
        run: |
          rm -rf .security-check
          mkdir .security-check
          unzip -q nexus-finance-deploy.zip -d .security-check
          rm -f .security-check/sitecustomize.py .security-check/nexus2_build.py
          rm -f .security-check/security_hardening.py .security-check/render.yaml
          rm -f .security-check/backend/migrations/003_nexus_v2_foundation.sql
          cp app.js index.html styles.css site-structure.js dashboard-charts.js manifest.json service-worker.js offline.html .security-check/
          rm -rf .security-check/icons .security-check/backend
          cp -R icons .security-check/icons
          cp -R backend .security-check/backend

      - name: Compile backend
        run: python -m py_compile .security-check/backend/server.py .security-check/backend/migrate.py

      - name: Run backend tests
        run: python -m unittest discover -s .security-check/backend/tests -t .security-check

      - name: Verify ownership and session invariants
        shell: python
        run: |
          from pathlib import Path
          s=Path(".security-check/backend/server.py").read_text(encoding="utf-8")
          required=[
            "SELECT * FROM transactions WHERE id = %s AND user_id = %s",
            "DELETE FROM transactions WHERE id = %s AND user_id = %s RETURNING id",
            "WHERE id = %s AND user_id = %s RETURNING *",
            "WHERE id = %s AND user_id = %s RETURNING id, status, paid_at",
            "SELECT id, name, target, current, date FROM goals WHERE user_id = %s",
            "DELETE FROM goals WHERE id = %s AND user_id = %s RETURNING id",
            "WHERE id = %s AND user_id = %s RETURNING id, name, target, current, date",
            "SameSite=Strict",
            '"/dashboard-charts.js"',
            "Content-Security-Policy",
            "origin_required",
          ]
          missing=[x for x in required if x not in s]
          if missing:
            raise SystemExit("Missing security invariants: "+repr(missing))

      - name: Verify browser has no stored integration secret
        shell: python
        run: |
          from pathlib import Path
          s=Path(".security-check/app.js").read_text(encoding="utf-8")
          forbidden=[
            'sessionStorage.setItem("nexusSheetsToken"',
            'localStorage.setItem("nexusSheetsToken"',
            'DATABASE_URL',
            'BINANCE_SECRET',
            'PRIVATE_KEY',
          ]
          bad=[x for x in forbidden if x in s]
          if bad:
            raise SystemExit("Client-side secret pattern found: "+repr(bad))

      - name: Verify database ownership constraints are packaged
        run: |
          test -f .security-check/backend/migrations/003_security_constraints.sql
          test -f .security-check/backend/migrations/004_legacy_imports.sql

      - name: Verify deployment package has no runtime patch hooks
        run: |
          test ! -f .security-check/sitecustomize.py
          test ! -f .security-check/nexus2_build.py
          test ! -f .security-check/security_hardening.py

      - name: Verify restored mobile and coin design
        shell: python
        run: |
          from pathlib import Path
          html=Path(".security-check/index.html").read_text(encoding="utf-8")
          css=Path(".security-check/styles.css").read_text(encoding="utf-8")
          app=Path(".security-check/app.js").read_text(encoding="utf-8")
          required_html=['class="coin-field"', 'styles.css?v=20261010-private9', 'app.js?v=20261010-private9', 'dashboard-charts.js?v=20261010-private9', 'site-structure.js?v=20261010-private9', 'apple-touch-icon', 'id="investments"', 'data-dashboard-chart="balance"', 'id="logoutAllButton"', 'id="appLoading"', 'id="modeTabsToggle"', 'id="authSubmitCoins"', 'class="mobile-tabs-switcher history-filter-switcher"', 'class="mobile-tabs-switcher crypto-tabs-switcher"', 'id="dashboardGoalMonitor"', 'id="educationComparison"', 'id="educationFeedback"']
          required_css=['@keyframes coin-fall', '.coin::before', '.coin::after', '.coin:nth-child(32)', '.dashboard-goal-list', '.education-comparison', '@keyframes ambient-points-fade', '.mobile-nav button.active{flex-basis:104px}', '.mobile-nav::before,.mobile-nav::after', 'grid-template-columns:minmax(0,1fr)', 'min-width:0', '@keyframes pixel-assemble', '@keyframes auth-coin-depth', '.mobile-month-slot{justify-content:center}']
          required_app=['await apiRequest("/api/auth/logout",{method:"POST"});', 'limit=${pageSize}&offset=${offset}', 'api/auth/logout-all', 'fetchAllTransactions', 'endAppLoading', 'requestAnimationFrame(()=>this.applyTouchMove())', 'function renderDashboardGoalMonitor()', 'function renderEducationComparison(x)']
          missing=[x for x in required_html if x not in html]+[x for x in required_css if x not in css]+[x for x in required_app if x not in app]
          if html.count('class="coin"') < 32:
            missing.append("32 falling background coins")
          if missing:
            raise SystemExit("Missing frontend requirements: "+repr(missing))

      - name: Verify PWA resources
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path(".security-check")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          if manifest.get("display")!="standalone" or manifest.get("lang")!="pt-BR":
            raise SystemExit("PWA manifest is missing required display/language values")
          for icon in manifest.get("icons",[]):
            if not (root/icon["src"].lstrip("/")).is_file():
              raise SystemExit("PWA icon is missing: "+icon["src"])
          sw=(root/"service-worker.js").read_text(encoding="utf-8")
          if 'url.pathname.startsWith("/api/")' not in sw or "caches.match(request)" not in sw:
            raise SystemExit("Service worker must bypass private API responses and serve cached shell assets")
          for name in ("offline.html","service-worker.js","dashboard-charts.js"):
            if not (root/name).is_file():
              raise SystemExit("PWA resource is missing: "+name)
