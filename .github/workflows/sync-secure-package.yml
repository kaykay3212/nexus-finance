name: Sync secure deployment package

on:
  push:
    branches: [deploy-backend]
    paths:
      - ".github/workflows/sync-secure-package.yml"
      - "app.js"
      - "site-structure.js"
      - "index.html"
      - "styles.css"
      - "dashboard-charts.js"
      - "manifest.json"
      - "service-worker.js"
      - "offline.html"
      - "icons/**"
      - "backend/**"
  workflow_dispatch:

# Always package the latest frontend before publishing to Render. Motion pass 4.

concurrency:
  group: nexus-package-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild deployment package from secured sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy-sync
          mkdir .deploy-sync
          cd .deploy-sync
          unzip -oq ../nexus-finance-deploy.zip
          rm -f ./sw.js ./sitecustomize.py ./nexus2_build.py ./security_hardening.py ./render.yaml ./security_migration.sql
          rm -f ./backend/migrations/003_nexus_v2_foundation.sql
          cp ../app.js ../index.html ../styles.css ../site-structure.js ../dashboard-charts.js ./
          cp ../manifest.json ./manifest.json
          cp ../service-worker.js ./service-worker.js
          cp ../offline.html ./offline.html
          rm -rf ./icons
          cp -R ../icons ./icons
          rm -rf ./backend
          cp -R ../backend ./backend
          python -m py_compile backend/server.py backend/migrate.py backend/binance_client.py
          python -m unittest discover -s backend/tests -t .
          zip -qr ../nexus-finance-deploy.zip . -x "*.pyc" "*/__pycache__/*"
          cd ..

      - name: Commit secured package
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- nexus-finance-deploy.zip; then
            echo "Package already synchronized."
            exit 0
          fi
          git config user.name "Nexus Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add nexus-finance-deploy.zip
          git commit -m "Sync secured sources into deployment package [skip ci]"
          git pull --rebase origin deploy-backend
          git push
