name: Build deployment archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify backend
        run: python -m unittest discover -s backend/tests -t .
      - name: Verify checked-in Render archive
        run: python tools/build_deploy_package.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-finance-deploy
          path: nexus-finance-deploy.zip
