name: Sync production deployment package

on:
  push:
    branches: [deploy-backend]
    paths:
      - "app.js"
      - "dashboard-charts.js"
      - "finance-analytics.js"
      - "index.html"
      - "styles.css"
      - "site-structure.js"
      - "backend/**"
      - "icons/**"
      - "manifest.json"
      - "offline.html"
      - "service-worker.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-production-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-backend
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backend regressions
        run: python -m unittest discover -s backend/tests -t .
      - name: Check frontend syntax
        run: |
          node --check app.js
          node --check dashboard-charts.js
          node --check finance-analytics.js
          node tests/frontend-regression.cjs
          node tests/analytics-regression.cjs
      - name: Build and verify deploy archive
        run: |
          python tools/build_deploy_package.py
          python tools/build_deploy_package.py --check
      - name: Commit synced archive
        run: |
          if git diff --quiet -- nexus-finance-deploy.zip; then
            echo "Archive already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-finance-deploy.zip
          git commit -m "Sync production archive after verified changes"
          git push
