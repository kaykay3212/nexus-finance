name: Sync production package after account reset
on:
  push:
    branches: [deploy-backend]
    paths:
      - "backend/migrations/005_owner_authorized_reset.sql"
      - ".github/workflows/sync-account-reset.yml"
      - "backend/server.py"
      - "backend/tests/**"
      - "app.js"
      - "index.html"
      - "service-worker.js"
      - "finance-analytics.js"
      - "dashboard-charts.js"
      - "styles.css"
      - "simulation.js"
      - "site-structure.js"
      - "tools/check_frontend.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test backend
        run: python -m unittest discover -s backend/tests -t .
      - name: Verify frontend structure and JavaScript syntax
        run: |
          python tools/check_frontend.py
          for file in app.js simulation.js finance-analytics.js dashboard-charts.js site-structure.js service-worker.js; do node --check "$file"; done
      - name: Rebuild Render archive
        run: |
          python tools/build_deploy_package.py
          python tools/build_deploy_package.py --check
      - name: Commit deploy archive
        run: |
          if git diff --quiet -- nexus-finance-deploy.zip; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-finance-deploy.zip
          git commit -m "Sync archive for authorized account reset"
          git push
