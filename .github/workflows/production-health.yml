name: Production health monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-production-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Nexus Finance production API
        shell: bash
        run: |
          set -euo pipefail
          url="https://nexus-finance-zgk5.onrender.com/api/health"
          for attempt in 1 2 3; do
            code=$(curl --silent --show-error --location --output /tmp/nexus-health.json \
              --write-out '%{http_code}' --max-time 35 "$url") || code="000"
            if [ "$code" = "200" ]; then
              python -m json.tool /tmp/nexus-health.json > /dev/null
              echo "Nexus API respondeu HTTP 200 com JSON válido"
              exit 0
            fi
            echo "::warning::Tentativa $attempt: HTTP $code"
            sleep 15
          done
          echo "::error::Health check do Nexus Finance falhou após 3 tentativas"
          exit 1
