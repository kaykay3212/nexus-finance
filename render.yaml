services:
  - type: web
    name: nexus-finance
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.migrate && python -m backend.server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: REGISTRATION_ALLOWED_EMAIL
        sync: false
      - key: HOST
        value: 0.0.0.0
