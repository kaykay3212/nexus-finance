services:
  - type: web
    name: nexus-finance
    runtime: python
    plan: free
    buildCommand: python -c "import zipfile; zipfile.ZipFile('nexus-finance-deploy.zip').extractall('.')" && python security_hardening.py && pip install -r backend/requirements.txt
    startCommand: python -m backend.migrate && python -m backend.server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: HOST
        value: 0.0.0.0
